services:
  postgresql:
    image: "postgres:16"
    container_name: postgres_container
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: outfits_db
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_USER: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d outfits_db"]
      interval: 2s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: app_container
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgres://postgres:mysecretpassword@postgresql:5432/outfits_db?sslmode=disable"
      PORT: "8080"
      SESSION_SECRET: "${SESSION_SECRET:-dev-secret-ootd-2026}"
    depends_on:
      postgresql:
        condition: service_healthy

volumes:
  postgres_data:
